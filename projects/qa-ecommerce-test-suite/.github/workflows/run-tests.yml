name: Playwright E2E & Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated E-Commerce Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium --with-deps

      - name: Execute End-to-End Playwright Tests
        run: |
          python tests/test_ecommerce_checkout.py

      - name: Upload Verification Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-checkout-screenshot
          path: checkout_verified.png
          if-no-files-found: ignore
