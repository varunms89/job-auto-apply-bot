services:
  - type: worker
    name: job-auto-apply-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python live_bot.py"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SCAN_INTERVAL_SECONDS
        value: "3600"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
